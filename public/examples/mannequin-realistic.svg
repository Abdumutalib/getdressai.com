<svg width="400" height="800" viewBox="0 0 400 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Matte White Fiberglass Material Gradient -->
  <defs>
    <linearGradient id="matteWhite" x1="200" y1="50" x2="200" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="eggHeadLight" cx="200" cy="80" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="200" cy="780" rx="100" ry="20" fill="black" fill-opacity="0.05" filter="blur(10px)"/>

  <!-- Realistic Egg-Head Mannequin Body Path -->
  <g filter="url(#softShadow)">
    <!-- Head (Egg-head style) -->
    <path d="M200 40 
             C185 40 170 50 165 75 
             C160 100 175 125 200 125 
             C225 125 240 100 235 75 
             C230 50 215 40 200 40 Z" 
          fill="url(#matteWhite)" />
    <path d="M200 40 
             C185 40 170 50 165 75 
             C160 100 175 125 200 125 
             C225 125 240 100 235 75 
             C230 50 215 40 200 40 Z" 
          fill="url(#eggHeadLight)" />

    <!-- Neck and Shoulders -->
    <path d="M190 120 L210 120 L215 130 C240 135 280 145 300 180 
             C315 210 320 250 320 300 
             L320 400 
             C320 450 300 480 280 500 
             L280 760 
             C280 780 260 785 240 785 
             L220 785 
             C205 785 200 770 200 740 
             L200 520 
             L200 740 
             C200 770 195 785 180 785 
             L160 785 
             C140 785 120 780 120 760 
             L120 500 
             C100 480 80 450 80 400 
             L80 300 
             C80 250 85 210 100 180 
             C120 145 160 135 185 130 Z" 
          fill="url(#matteWhite)" />

    <!-- Subtle Anatomical Lines -->
    <path d="M160 140 Q200 155 240 140" stroke="#CBD5E1" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M140 380 Q200 405 260 380" stroke="#CBD5E1" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M200 150 L200 380" stroke="#CBD5E1" stroke-width="0.5" fill="none" opacity="0.2"/>
  </g>
</svg>
