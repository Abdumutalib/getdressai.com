name: Inspect production web root

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-vps-root.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Find the getdressai.com Nginx site root
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 178.218.207.176
          username: root
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          script: |
            set -eu
            printf '%s\n' 'DNS addresses:'
            getent ahostsv4 getdressai.com | awk '!seen[$1]++ { print $1 }' || true

            printf '%s\n' 'Active web servers:'
            for service in nginx apache2 httpd caddy traefik; do
              if systemctl is-active --quiet "$service"; then
                printf '%s\n' "$service"
              fi
            done

            printf '%s\n' 'Configuration files mentioning the domain:'
            for directory in /etc/nginx /etc/apache2 /etc/caddy /etc/traefik; do
              if [ -d "$directory" ]; then
                grep -RIlE '(^|[[:space:]])(getdressai\.com|www\.getdressai\.com)([[:space:];]|$)' "$directory" 2>/dev/null || true
              fi
            done

            printf '%s\n' 'Matching web directories:'
            for directory in /var/www /srv/www; do
              if [ -d "$directory" ]; then
                find "$directory" -maxdepth 2 -type d \( -iname '*getdressai*' -o -iname '*dressai*' \) -print 2>/dev/null || true
              fi
            done

            printf '%s\n' 'Default Nginx server roots:'
            nginx -T 2>/dev/null | awk '
              /^[[:space:]]*server[[:space:]]*\{/ {
                in_server = 1
                depth = 0
                is_default = 0
                details = ""
              }

              in_server {
                line = $0
                if (line ~ /^[[:space:]]*listen[[:space:]]/ &&
                    line ~ /default_server/) {
                  is_default = 1
                }
                if (line ~ /^[[:space:]]*(listen|server_name|root|alias)[[:space:]]/) {
                  directive = line
                  sub(/^[[:space:]]*/, "", directive)
                  details = details "  " directive "\n"
                } else if (line ~ /^[[:space:]]*proxy_pass[[:space:]]/) {
                  details = details "  proxy_pass: configured\n"
                }

                braces = line
                sub(/[[:space:]]*#.*/, "", braces)
                opened = gsub(/\{/, "", braces)
                closed = gsub(/\}/, "", braces)
                depth += opened - closed

                if (depth == 0) {
                  if (is_default) {
                    found = 1
                    printf "%s", details
                  }
                  in_server = 0
                }
              }

              END {
                if (!found) {
                  print "No explicit default_server block configured"
                }
              }
            '

            printf '%s\n' 'Public domain HTTP response:'
            curl -sSI --connect-timeout 5 --max-time 10 http://getdressai.com/ | sed -n '1,5p' || true

            printf '%s\n' 'Public domain HTTPS response:'
            curl -ksSI --connect-timeout 5 --max-time 10 https://getdressai.com/ | sed -n '1,5p' || true

            if [ -f /etc/letsencrypt/live/getdressai.com/fullchain.pem ]; then
              printf '%s\n' 'Let’s Encrypt certificate exists for getdressai.com'
            else
              printf '%s\n' 'No Let’s Encrypt certificate found for getdressai.com'
            fi

            printf '%s\n' 'Current page title:'
            curl -ksS --connect-timeout 5 --max-time 10 https://getdressai.com/ |
              grep -oi '<title[^>]*>[^<]*</title>' | head -n 1 || true

            printf '%s\n' 'Current HTTPS redirect target:'
            curl -ksSI --connect-timeout 5 --max-time 10 https://getdressai.com/ |
              awk 'tolower($1) == "location:" { sub(/\?.*/, "?[redacted]", $2); print $2; exit }' || true

            printf '%s\n' 'Current TLS certificate:'
            echo | openssl s_client -connect getdressai.com:443 -servername getdressai.com 2>/dev/null |
              openssl x509 -noout -subject -issuer -dates -ext subjectAltName || true
